<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - S.T.A.S.I.S.</title>
  <meta property="og:title" content="Contact — S.T.A.S.I.S.">
  <meta property="og:description" content="Get in touch about esports operations, broadcast, or production projects.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="components.js" defer></script>
  <style>
    .container {
      padding: 60px 20px;
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 4rem;
      color: var(--primary);
      margin-bottom: 0.3em;
    }
    .subtitle {
      font-size: 1.5rem;
      color: var(--highlight);
      margin-bottom: 2em;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    input, textarea {
      padding: 12px;
      background-color: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.2rem;
      resize: none;
      transition: box-shadow 0.3s ease;
    }
    input::placeholder, textarea::placeholder {
      color: var(--muted);
    }
    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 8px var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contact</h1>
    <p class="subtitle">Let's get in touch — no identity required.</p>

    <div id="site-nav"></div>

    <form id="contact-form">
      <input type="text" name="name" placeholder="Your Name" required />
      <input type="email" name="email" placeholder="Your Email" required />
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <button type="submit" class="button">Send Message</button>
    </form>
  </div>

  <div id="site-footer"></div>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'thankyou.html';
    });
  </script>
</body>
</html>
